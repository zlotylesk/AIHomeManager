

parameters:
    app.discogs_clock_drift.threshold_seconds: 300
    # Search backend flag fallback (HMAI-361): the value used when
    # SEARCH_ENGINE_BACKEND is unset or empty. MySQL FULLTEXT stays the default —
    # OpenSearch is switched on deliberately, never by merely deploying.
    app.search_backend.default: 'fulltext'
    # Search index alias (HMAI-362): the name reads and writes go through, so a
    # reindex can swap the physical index underneath without an outage. Only
    # overridden per environment — the test suite points parallel workers at
    # separate aliases, since they share one engine (unlike MySQL/Redis, which
    # are isolated per worker).
    app.search_index.default_alias: 'search_documents'
    # The single currency the budget is kept in, used when BUDGET_CURRENCY is
    # unset or empty. Multi-currency budgeting is deliberately unsupported — an
    # amount in any other currency is rejected rather than converted or silently
    # relabelled (see App\Module\Budget\Application\SystemCurrency).
    app.budget.default_currency: 'PLN'
    # Where the monitor remembers which alerts it has already announced
    # (HMAI-432), when MONITORING_STATE_FILE is unset. A path rather than a cache
    # pool or a table on purpose: this is read and written by the one code path
    # that has to keep working while MySQL, Redis and RabbitMQ are the thing
    # being reported on.
    monitoring.default_state_file: '%kernel.project_dir%/var/monitoring/alert-state.json'

services:
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    _instanceof:
        # Notification channel adapters (HMAI-278): auto-tagged so the dispatch
        # orchestrator collects every installed channel without a per-adapter
        # services.yaml entry as e-mail/push land.
        App\Module\Notifications\Domain\Port\NotificationChannelInterface:
            tags: ['notifications.channel']

    App\:
        resource: '../src/'
        exclude:
            # The fixture classes extend Doctrine\Bundle\FixturesBundle\Fixture,
            # which ships in a require-dev package. A production install
            # (`composer install --no-dev`) does not have it, so registering
            # them here makes compiling the container fatal — "Attempted to load
            # class Fixture" — before a single request is served. They are
            # registered below for the two environments that install the bundle.
            - '../src/DataFixtures/'

    App\Infrastructure\Backup\DatabaseBackupService:
        arguments:
            $databaseUrl: '%env(DATABASE_URL)%'
            $backupDir: '%env(BACKUP_DIR)%'

    App\Module\Series\Domain\Repository\SeriesRepositoryInterface:
        alias: App\Module\Series\Infrastructure\Persistence\DoctrineSeriesRepository

    app.redis:
        class: \Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments: ['%env(REDIS_URL)%']

    # Search engine client (HMAI-360, epic HMAI-359): the app-data OpenSearch
    # instance, separate from the Graylog log store. Built lazily from
    # SEARCH_ENGINE_DSN — no connection until the first request. Deliberately NOT
    # wrapped in RateLimitedHttpClient: opensearch-php 2.x uses its own ringphp
    # transport (not a Symfony HttpClientInterface), and this is internal
    # single-node traffic with no external quota (the Google Calendar SDK
    # precedent). Consumed by the OpenSearch engine adapter (HMAI-361).
    app.search_client:
        class: OpenSearch\Client
        factory: ['App\SearchEngine\OpenSearchClientFactory', 'create']
        arguments: ['%env(SEARCH_ENGINE_DSN)%']

    App\Module\Series\Infrastructure\Messenger\EpisodeRatedHandler:
        arguments:
            $redis: '@app.redis'

    App\Module\Series\Application\Handler\DeleteSeriesHandler:
        arguments:
            $redis: '@app.redis'

    App\Module\Series\Application\Handler\DeleteSeasonHandler:
        arguments:
            $redis: '@app.redis'

    App\Module\Series\Application\Handler\DeleteEpisodeHandler:
        arguments:
            $redis: '@app.redis'

    gelf.transport.udp:
        class: Gelf\Transport\UdpTransport
        arguments:
            - '%env(GRAYLOG_HOST)%'
            - '%env(int:GRAYLOG_PORT)%'

    gelf.transport:
        class: Gelf\Transport\IgnoreErrorTransportWrapper
        arguments:
            - '@gelf.transport.udp'

    gelf.publisher:
        class: Gelf\Publisher
        arguments:
            - '@gelf.transport'

    App\Module\Series\Infrastructure\Logging\NewRelicMonologHandler: ~

    App\Module\Budget\Application\SystemCurrency:
        arguments:
            $code: '%env(default:app.budget.default_currency:BUDGET_CURRENCY)%'

    App\Module\Budget\Domain\Repository\TransactionRepositoryInterface:
        alias: App\Module\Budget\Infrastructure\Persistence\DoctrineTransactionRepository

    App\Module\Budget\Domain\Repository\CategoryRepositoryInterface:
        alias: App\Module\Budget\Infrastructure\Persistence\DoctrineCategoryRepository

    App\Module\Recipes\Domain\Repository\RecipeRepositoryInterface:
        alias: App\Module\Recipes\Infrastructure\Persistence\DoctrineRecipeRepository

    App\Module\Recipes\Domain\Repository\MealPlanRepositoryInterface:
        alias: App\Module\Recipes\Infrastructure\Persistence\DoctrineMealPlanRepository

    App\Module\Tasks\Domain\Repository\TaskRepositoryInterface:
        alias: App\Module\Tasks\Infrastructure\Persistence\DoctrineTaskRepository

    App\Module\Books\Domain\Repository\BookRepositoryInterface:
        alias: App\Module\Books\Infrastructure\Persistence\DoctrineBookRepository

    App\Module\Goals\Domain\Repository\GoalRepositoryInterface:
        alias: App\Module\Goals\Infrastructure\Persistence\DoctrineGoalRepository

    App\Module\Goals\Domain\Repository\StreakRepositoryInterface:
        alias: App\Module\Goals\Infrastructure\Persistence\DoctrineStreakRepository

    App\Module\Movies\Domain\Repository\MovieRepositoryInterface:
        alias: App\Module\Movies\Infrastructure\Persistence\DoctrineMovieRepository

    App\Module\Notifications\Domain\Repository\NotificationPreferenceRepositoryInterface:
        alias: App\Module\Notifications\Infrastructure\Persistence\DoctrineNotificationPreferenceRepository

    App\Module\Podcasts\Domain\Repository\PodcastRepositoryInterface:
        alias: App\Module\Podcasts\Infrastructure\Persistence\DoctrinePodcastRepository

    App\Module\Podcasts\Domain\Repository\EpisodeRepositoryInterface:
        alias: App\Module\Podcasts\Infrastructure\Persistence\DoctrineEpisodeRepository

    App\Module\Podcasts\Domain\Repository\PodcastListeningSessionRepositoryInterface:
        alias: App\Module\Podcasts\Infrastructure\Persistence\DoctrinePodcastListeningSessionRepository

    App\Module\Notifications\Domain\Repository\NotificationRepositoryInterface:
        alias: App\Module\Notifications\Infrastructure\Persistence\DoctrineNotificationRepository

    App\Module\Notifications\Application\CommandHandler\DispatchNotificationHandler:
        arguments:
            $channelAdapters: !tagged_iterator notifications.channel

    # Single-user system: one sender, one recipient, both from ENV. The channel
    # tag itself comes from the _instanceof rule above.
    App\Module\Notifications\Infrastructure\Channel\EmailNotificationChannel:
        arguments:
            $from: '%env(NOTIFICATIONS_MAIL_FROM)%'
            $to: '%env(NOTIFICATIONS_MAIL_TO)%'

    # The scheduler sweep's sources (HMAI-282): per-source-module DBAL read
    # adapters, aggregated by the composite that backs the port. Tagged
    # explicitly rather than by _instanceof so the composite — which implements
    # the same interface — cannot end up iterating over itself.
    App\Module\Notifications\Infrastructure\Provider\UpcomingTaskCandidates:
        tags: ['notifications.candidate_provider']

    App\Module\Notifications\Infrastructure\Provider\StreakAtRiskCandidates:
        tags: ['notifications.candidate_provider']

    App\Module\Notifications\Infrastructure\Provider\DailyArticleCandidates:
        tags: ['notifications.candidate_provider']

    App\Module\Notifications\Infrastructure\Provider\DailyDigestCandidates:
        tags: ['notifications.candidate_provider']

    App\Module\Notifications\Domain\Port\NotificationCandidateProviderInterface:
        alias: App\Module\Notifications\Infrastructure\Provider\CompositeNotificationCandidateProvider

    App\Module\Notifications\Infrastructure\Provider\CompositeNotificationCandidateProvider:
        arguments:
            $providers: !tagged_iterator notifications.candidate_provider

    # Operational alerting (HMAI-432). Deliberately wired outside the
    # Notifications module: its dispatch engine reads preferences from MySQL and
    # persists a row before sending, which is right for user notifications and
    # impossible for an alert whose job is to announce that MySQL is gone. These
    # services touch nothing but Mailer and the local disk.
    #
    # Probes are tagged explicitly rather than by _instanceof, the same reason
    # the notification candidate providers are: the tag is the registration, so
    # adding a probe should be a visible decision.
    App\Monitoring\Probe\HealthComponentProbe:
        tags: ['monitoring.probe']

    # The same variable and the same numbers scripts/doctor.sh uses. Two answers
    # to "is the backup fresh" in one repository is how one of them quietly
    # starts tolerating a state the other rejects.
    App\Monitoring\Probe\BackupFreshnessProbe:
        arguments:
            $backupDir: '%env(BACKUP_DIR)%'
            $maxAgeHours: '%env(int:BACKUP_MAX_AGE_HOURS)%'
            $minBytes: '%env(int:BACKUP_MIN_BYTES)%'
        tags: ['monitoring.probe']

    App\Monitoring\Probe\DeadLetterQueueProbe:
        arguments:
            $transport: '@messenger.transport.failed'
            $threshold: '%env(int:MONITORING_DLQ_THRESHOLD)%'
        tags: ['monitoring.probe']

    # One sender, one recipient — the same pair the notification e-mails use,
    # because there is one owner and splitting them would only create a second
    # address to forget to configure.
    App\Monitoring\EmailAlertChannel:
        arguments:
            $from: '%env(NOTIFICATIONS_MAIL_FROM)%'
            $to: '%env(NOTIFICATIONS_MAIL_TO)%'
        tags: ['monitoring.channel']

    App\Monitoring\FileAlertStateStore:
        arguments:
            $stateFile: '%env(default:monitoring.default_state_file:MONITORING_STATE_FILE)%'

    App\Monitoring\AlertStateStoreInterface:
        alias: App\Monitoring\FileAlertStateStore

    App\Monitoring\SystemMonitor:
        arguments:
            $probes: !tagged_iterator monitoring.probe
            $channels: !tagged_iterator monitoring.channel

    App\Module\Notifications\Domain\Repository\PushSubscriptionRepositoryInterface:
        alias: App\Module\Notifications\Infrastructure\Persistence\DoctrinePushSubscriptionRepository

    # VAPID identifies this server to the push service, so no third-party
    # provider sits in the delivery path.
    App\Module\Notifications\Infrastructure\Channel\WebPushSenderInterface:
        alias: App\Module\Notifications\Infrastructure\Channel\MinishlinkWebPushSender

    App\Module\Notifications\Infrastructure\Channel\MinishlinkWebPushSender:
        arguments:
            $publicKey: '%env(VAPID_PUBLIC_KEY)%'
            $privateKey: '%env(VAPID_PRIVATE_KEY)%'
            $subject: '%env(VAPID_SUBJECT)%'

    App\Module\Music\Application\QueryHandler\GetMusicComparisonHandler:
        arguments:
            $redis: '@app.redis'
            $lastfmUsername: '%env(LASTFM_USERNAME)%'
            $discogsUsername: '%env(DISCOGS_USERNAME)%'

    App\Module\Music\Domain\Repository\ListeningSessionRepositoryInterface:
        alias: App\Module\Music\Infrastructure\Persistence\DoctrineListeningSessionRepository

    App\Module\Music\Domain\Port\VinylCollectionInterface:
        alias: App\Module\Music\Infrastructure\External\DiscogsApiClient

    App\Module\Music\Domain\Port\VinylCollectionLoaderInterface:
        alias: App\Module\Music\Infrastructure\External\DiscogsApiClient

    App\Module\Music\Infrastructure\External\DiscogsCredentials:
        arguments:
            $consumerKey: '%env(DISCOGS_CONSUMER_KEY)%'
            $consumerSecret: '%env(DISCOGS_CONSUMER_SECRET)%'

    App\Module\Music\Infrastructure\External\DiscogsClockDriftDetector:
        arguments:
            $thresholdSeconds: '%app.discogs_clock_drift.threshold_seconds%'

    App\Module\Music\Infrastructure\External\DiscogsApiClient:
        arguments:
            $httpClient: '@app.discogs_http_client'
            $redis: '@app.redis'

    App\Module\Music\Infrastructure\Persistence\DiscogsTokenRepositoryInterface:
        alias: App\Module\Music\Infrastructure\Persistence\DiscogsTokenRepository

    App\Security\TokenCipher:
        abstract: true

    app.discogs_token_cipher:
        class: App\Security\TokenCipher
        arguments:
            $key: '%env(base64:DISCOGS_TOKEN_KEY)%'

    app.google_token_cipher:
        class: App\Security\TokenCipher
        arguments:
            $key: '%env(base64:GOOGLE_TOKEN_KEY)%'

    app.trakt_token_cipher:
        class: App\Security\TokenCipher
        arguments:
            $key: '%env(base64:TRAKT_TOKEN_KEY)%'

    app.spotify_token_cipher:
        class: App\Security\TokenCipher
        arguments:
            $key: '%env(base64:SPOTIFY_TOKEN_KEY)%'

    App\Module\Music\Infrastructure\Persistence\DiscogsTokenRepository:
        arguments:
            $cipher: '@app.discogs_token_cipher'

    App\Module\Tasks\Infrastructure\Persistence\GoogleOAuthTokenRepository:
        arguments:
            $cipher: '@app.google_token_cipher'

    App\Module\Series\Infrastructure\Persistence\TraktOAuthTokenRepository:
        arguments:
            $cipher: '@app.trakt_token_cipher'

    App\Module\Series\Infrastructure\Persistence\TraktTokenRepositoryInterface:
        alias: App\Module\Series\Infrastructure\Persistence\TraktOAuthTokenRepository

    App\Module\Podcasts\Infrastructure\Persistence\SpotifyOAuthTokenRepository:
        arguments:
            $cipher: '@app.spotify_token_cipher'

    App\Module\Podcasts\Infrastructure\Persistence\SpotifyTokenRepositoryInterface:
        alias: App\Module\Podcasts\Infrastructure\Persistence\SpotifyOAuthTokenRepository

    # Shared-kernel read port for the single Trakt OAuth token (HMAI-290): the
    # Movies Trakt adapter reads it without reaching into Series Infrastructure.
    App\Shared\Security\TraktTokenProviderInterface:
        alias: App\Module\Series\Infrastructure\Persistence\TraktOAuthTokenRepository

    App\Module\Series\Infrastructure\External\TraktTokenProvider:
        arguments:
            $clientId: '%env(TRAKT_CLIENT_ID)%'
            $clientSecret: '%env(TRAKT_CLIENT_SECRET)%'
            $redirectUri: '%env(TRAKT_REDIRECT_URI)%'

    App\Controller\TraktAuthController:
        arguments:
            $clientId: '%env(TRAKT_CLIENT_ID)%'
            $clientSecret: '%env(TRAKT_CLIENT_SECRET)%'
            $redirectUri: '%env(TRAKT_REDIRECT_URI)%'

    App\Controller\SpotifyAuthController:
        arguments:
            $clientId: '%env(SPOTIFY_CLIENT_ID)%'
            $clientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'
            $redirectUri: '%env(SPOTIFY_REDIRECT_URI)%'

    App\Controller\DiscogsAuthController:
        arguments:
            $callbackUrl: '%env(DISCOGS_CALLBACK_URL)%'

    App\Controller\Api\MusicController:
        arguments:
            $lastfmUsername: '%env(LASTFM_USERNAME)%'
            $discogsUsername: '%env(DISCOGS_USERNAME)%'

    App\Module\Music\Domain\Port\MusicListeningHistoryInterface:
        alias: App\Module\Music\Infrastructure\External\LastFmApiClient

    App\Module\Music\Infrastructure\External\LastFmApiClient:
        arguments:
            $httpClient: '@app.lastfm_http_client'
            $redis: '@app.redis'
            $apiKey: '%env(LASTFM_API_KEY)%'

    App\Module\Books\Domain\Port\BookMetadataProviderInterface:
        alias: App\Module\Books\Infrastructure\External\NationalLibraryApiClient

    App\Module\Books\Infrastructure\External\NationalLibraryApiClient:
        arguments:
            $httpClient: '@app.national_library_http_client'
            $redis: '@app.redis'

    App\Module\Tasks\Domain\Port\CalendarServiceInterface:
        alias: App\Module\Tasks\Infrastructure\Google\GoogleCalendarService

    App\Module\Tasks\Infrastructure\Google\GoogleClientFactory:
        arguments:
            $clientId: '%env(GOOGLE_CLIENT_ID)%'
            $clientSecret: '%env(GOOGLE_CLIENT_SECRET)%'
            $redirectUri: '%env(GOOGLE_REDIRECT_URI)%'

    google.client:
        class: Google\Client
        factory: ['@App\Module\Tasks\Infrastructure\Google\GoogleClientFactory', 'create']

    App\Module\Tasks\Infrastructure\Persistence\GoogleTokenRepositoryInterface:
        alias: App\Module\Tasks\Infrastructure\Persistence\GoogleOAuthTokenRepository

    # Shared read-only Google-token port (HMAI-237): the YouTube adapter reads
    # the OAuth token through this Shared-kernel contract instead of reaching
    # into the Tasks Infrastructure. Same repository backs it.
    App\Shared\Security\GoogleTokenProviderInterface:
        alias: App\Module\Tasks\Infrastructure\Persistence\GoogleOAuthTokenRepository

    # Shared "valid access token" port (HMAI-399): unlike the read-only port
    # above, this one transparently refreshes an expired Google token. Both
    # GoogleCalendarService (Tasks) and YouTubeApiClient (YouTubeProgress, via
    # this Shared abstraction) go through it, so freshness stops depending on
    # which module happened to touch the shared credential most recently.
    App\Shared\Security\GoogleAccessTokenProviderInterface:
        alias: App\Module\Tasks\Infrastructure\Google\GoogleAccessTokenProvider

    App\Module\Tasks\Infrastructure\Google\GoogleAccessTokenProvider:
        arguments:
            $client: '@google.client'

    App\Module\Tasks\Infrastructure\Google\GoogleCalendarService:
        arguments:
            $client: '@google.client'

    App\Controller\GoogleAuthController:
        arguments:
            $client: '@google.client'

    App\Module\Articles\Domain\Repository\ArticleRepositoryInterface:
        alias: App\Module\Articles\Infrastructure\Persistence\DoctrineArticleRepository

    App\Module\Articles\Domain\Repository\ArticleDailyPickRepositoryInterface:
        alias: App\Module\Articles\Infrastructure\Persistence\DoctrineArticleDailyPickRepository

    App\Module\YouTubeProgress\Domain\Repository\VideoRepositoryInterface:
        alias: App\Module\YouTubeProgress\Infrastructure\Persistence\DoctrineVideoRepository

    App\Module\YouTubeProgress\Domain\Repository\WatchSessionRepositoryInterface:
        alias: App\Module\YouTubeProgress\Infrastructure\Persistence\DoctrineWatchSessionRepository

    App\Module\YouTubeProgress\Domain\Port\YouTubePlaylistReaderInterface:
        alias: App\Module\YouTubeProgress\Infrastructure\External\YouTubeApiClient

    App\Module\YouTubeProgress\Domain\Port\YouTubePlaylistWriterInterface:
        alias: App\Module\YouTubeProgress\Infrastructure\External\YouTubeApiClient

    App\Module\YouTubeProgress\Infrastructure\External\YouTubeApiClient:
        arguments:
            $httpClient: '@app.youtube_http_client'

    App\Module\Articles\Application\QueryHandler\GetArticleOfTheDayHandler:
        arguments:
            $redis: '@app.redis'
            $preferredCategory: '%articles.preferred_category%'

    App\Module\Articles\Application\Handler\MarkArticleAsReadHandler:
        arguments:
            $redis: '@app.redis'

    App\Module\Articles\Application\Handler\DeleteArticleHandler:
        arguments:
            $redis: '@app.redis'

    App\Security\ApiKeyAuthenticator:
        arguments:
            $expectedApiKey: '%env(API_KEY)%'

    App\EventListener\ApiRateLimitListener:
        arguments:
            $apiPerIpLimiter: '@limiter.api_per_ip'

    App\Http\RateLimitedHttpClient:
        abstract: true

    app.discogs_http_client:
        class: App\Http\RateLimitedHttpClient
        arguments:
            $inner: '@http_client'
            $limiterFactory: '@limiter.discogs_api'
            $limiterName: 'discogs_api'

    app.lastfm_http_client:
        class: App\Http\RateLimitedHttpClient
        arguments:
            $inner: '@http_client'
            $limiterFactory: '@limiter.lastfm_api'
            $limiterName: 'lastfm_api'

    app.national_library_http_client:
        class: App\Http\RateLimitedHttpClient
        arguments:
            $inner: '@http_client'
            $limiterFactory: '@limiter.national_library_api'
            $limiterName: 'national_library_api'

    app.youtube_http_client:
        class: App\Http\RateLimitedHttpClient
        arguments:
            $inner: '@http_client'
            $limiterFactory: '@limiter.youtube_api'
            $limiterName: 'youtube_api'

    app.trakt_http_client:
        class: App\Http\RateLimitedHttpClient
        arguments:
            $inner: '@http_client'
            $limiterFactory: '@limiter.trakt_api'
            $limiterName: 'trakt_api'

    app.spotify_http_client:
        class: App\Http\RateLimitedHttpClient
        arguments:
            $inner: '@http_client'
            $limiterFactory: '@limiter.spotify_api'
            $limiterName: 'spotify_api'

    # Podcasts listening source (HMAI-323). The token provider refreshes through
    # the same rate-limited client, so a refresh storm cannot slip past the
    # limiter that guards the reads.
    App\Module\Podcasts\Infrastructure\External\SpotifyTokenProvider:
        arguments:
            $httpClient: '@app.spotify_http_client'
            $clientId: '%env(SPOTIFY_CLIENT_ID)%'
            $clientSecret: '%env(SPOTIFY_CLIENT_SECRET)%'

    App\Module\Podcasts\Infrastructure\External\SpotifyPodcastApiClient:
        arguments:
            $httpClient: '@app.spotify_http_client'

    App\Module\Podcasts\Domain\Port\PodcastListeningHistoryInterface:
        alias: App\Module\Podcasts\Infrastructure\External\SpotifyPodcastApiClient

    App\Module\Series\Infrastructure\External\TraktApiClient:
        arguments:
            $httpClient: '@app.trakt_http_client'
            $clientId: '%env(TRAKT_CLIENT_ID)%'

    App\Module\Series\Domain\Port\WatchedShowsProviderInterface:
        alias: App\Module\Series\Infrastructure\External\TraktApiClient

    App\Module\Series\Domain\Port\RatingsProviderInterface:
        alias: App\Module\Series\Infrastructure\External\TraktApiClient

    # Movies Trakt import (HMAI-290): the rate-limited Trakt HTTP client + the
    # client id, reading the shared token through the Shared-kernel port.
    App\Module\Movies\Infrastructure\External\TraktMoviesApiClient:
        arguments:
            $httpClient: '@app.trakt_http_client'
            $clientId: '%env(TRAKT_CLIENT_ID)%'

    App\Module\Movies\Domain\Port\WatchedMoviesProviderInterface:
        alias: App\Module\Movies\Infrastructure\External\TraktMoviesApiClient

    App\Module\Movies\Domain\Port\MovieRatingsProviderInterface:
        alias: App\Module\Movies\Infrastructure\External\TraktMoviesApiClient

    # Goals activity stream (HMAI-250): per-source-module DBAL read adapters,
    # aggregated by the composite that backs the ActivityProviderInterface port.
    App\Module\Goals\Infrastructure\Activity\BooksActivityAdapter:
        tags: ['goals.activity_provider']

    App\Module\Goals\Infrastructure\Activity\SeriesActivityAdapter:
        tags: ['goals.activity_provider']

    App\Module\Goals\Infrastructure\Activity\ArticlesActivityAdapter:
        tags: ['goals.activity_provider']

    App\Module\Goals\Infrastructure\Activity\YouTubeActivityAdapter:
        tags: ['goals.activity_provider']

    App\Module\Goals\Infrastructure\Activity\MusicActivityAdapter:
        tags: ['goals.activity_provider']

    App\Module\Goals\Infrastructure\Activity\CompositeActivityProvider:
        arguments:
            $providers: !tagged_iterator goals.activity_provider

    App\Module\Goals\Domain\Port\ActivityProviderInterface:
        alias: App\Module\Goals\Infrastructure\Activity\CompositeActivityProvider

    # The single source of truth for a streak (HMAI-412). Goals owns the concept
    # and implements the shared port; the Dashboard cockpit reads through the
    # abstraction rather than deriving its own answer from the `streaks` table,
    # which is only written nightly. Shared kernel, so deptrac stays 0/0 in both
    # directions — the Google/Trakt token-port precedent.
    App\Shared\Activity\StreakReaderInterface:
        alias: App\Module\Goals\Infrastructure\Activity\StreakReader

    # Insights read cache (HMAI-334): the composed trends read model is cached in a
    # dedicated Redis pool keyed by granularity + window. Cache-on-read rather than
    # scheduler prewarming — the window is a caller-chosen range, so there is no one
    # shape to precompute; the frontend's default window is what gets hit repeatedly.
    App\Module\Insights\Infrastructure\Cache\RedisTrendsCache:
        arguments:
            $cache: '@cache.insights'

    App\Module\Insights\Application\Cache\TrendsCacheInterface:
        alias: App\Module\Insights\Infrastructure\Cache\RedisTrendsCache

    # Insights trend data (HMAI-330): one DBAL read adapter per habit metric,
    # routed by the composite that backs the TrendDataProviderInterface port.
    # Tagged explicitly (not via _instanceof) so the composite — which implements
    # the same interface — cannot end up iterating over itself.
    App\Module\Insights\Infrastructure\Provider\BooksPagesReadAdapter:
        tags: ['insights.trend_provider']

    App\Module\Insights\Infrastructure\Provider\SeriesEpisodesWatchedAdapter:
        tags: ['insights.trend_provider']

    App\Module\Insights\Infrastructure\Provider\YouTubeMinutesWatchedAdapter:
        tags: ['insights.trend_provider']

    App\Module\Insights\Infrastructure\Provider\MusicTracksPlayedAdapter:
        tags: ['insights.trend_provider']

    App\Module\Insights\Infrastructure\Provider\TasksCompletionRateAdapter:
        tags: ['insights.trend_provider']

    App\Module\Insights\Infrastructure\Provider\CompositeTrendDataProvider:
        arguments:
            $providers: !tagged_iterator insights.trend_provider

    App\Module\Insights\Domain\Port\TrendDataProviderInterface:
        alias: App\Module\Insights\Infrastructure\Provider\CompositeTrendDataProvider

    # Search indexing (HMAI-267): per-source-module DBAL read adapters expose
    # indexable documents, aggregated by the composite that backs the
    # SearchableProviderInterface port (deptrac-clean, no cross-module imports).
    App\Module\Search\Infrastructure\Provider\BooksSearchableProvider:
        tags: ['search.searchable_provider']

    App\Module\Search\Infrastructure\Provider\ArticlesSearchableProvider:
        tags: ['search.searchable_provider']

    App\Module\Search\Infrastructure\Provider\SeriesSearchableProvider:
        tags: ['search.searchable_provider']

    App\Module\Search\Infrastructure\Provider\TasksSearchableProvider:
        tags: ['search.searchable_provider']

    App\Module\Search\Infrastructure\Provider\MusicSearchableProvider:
        tags: ['search.searchable_provider']

    App\Module\Search\Infrastructure\Provider\CompositeSearchableProvider:
        arguments:
            $providers: !tagged_iterator search.searchable_provider

    App\Module\Search\Domain\Port\SearchableProviderInterface:
        alias: App\Module\Search\Infrastructure\Provider\CompositeSearchableProvider

    # Search engine (HMAI-268): the FULLTEXT engine + index rebuilder sit behind
    # their Domain ports so the read/write side stays swappable.
    #
    # Two adapters now implement the read port (HMAI-361, epic HMAI-359): MySQL
    # FULLTEXT and OpenSearch. SEARCH_ENGINE_BACKEND picks the active one at
    # runtime — an alias could not, being resolved at compile time — with
    # FULLTEXT as the fallback, so OpenSearch is only ever used on purpose.
    # The index schema (HMAI-362). Everything that touches OpenSearch resolves
    # the index name from here, so the adapter, the provisioning command and the
    # tests cannot disagree about where the documents live.
    App\Module\Search\Infrastructure\Index\SearchIndexDefinition:
        arguments:
            $alias: '%env(default:app.search_index.default_alias:SEARCH_INDEX_ALIAS)%'

    App\Module\Search\Infrastructure\Index\SearchIndexManager:
        arguments:
            $client: '@app.search_client'

    App\Module\Search\Infrastructure\Engine\OpenSearchEngine:
        arguments:
            $client: '@app.search_client'

    app.search_engine.backend:
        class: App\Module\Search\Domain\Port\SearchEngineInterface
        factory: ['App\Module\Search\Infrastructure\Engine\SearchEngineFactory', 'create']
        arguments:
            $backend: '%env(default:app.search_backend.default:SEARCH_ENGINE_BACKEND)%'
            $fulltext: '@App\Module\Search\Infrastructure\Engine\FulltextSearchEngine'
            $openSearch: '@App\Module\Search\Infrastructure\Engine\OpenSearchEngine'
            # Selecting OpenSearch wraps it in a fallback to FULLTEXT (HMAI-365);
            # the logger is what makes a silent degrade visible.
            $logger: '@logger'

    # Whichever backend is active is fronted by a Redis result cache (HMAI-271);
    # both sit behind the SearchEngineInterface port so the read side stays
    # swappable.
    App\Module\Search\Infrastructure\Cache\CachingSearchEngine:
        arguments:
            $engine: '@app.search_engine.backend'
            $cache: '@cache.search'

    App\Module\Search\Domain\Port\SearchEngineInterface:
        alias: App\Module\Search\Infrastructure\Cache\CachingSearchEngine

    App\Module\Search\Infrastructure\Index\SearchIndexer:
        arguments:
            $cache: '@cache.search'

    App\Module\Search\Infrastructure\Index\OpenSearchIndexer:
        arguments:
            $client: '@app.search_client'
            $cache: '@cache.search'

    # The index writer follows the same flag as the reader (HMAI-363): writing to
    # one backend while reading the other would leave search answering from an
    # index nothing maintains.
    app.search_indexer.backend:
        class: App\Module\Search\Domain\Port\SearchIndexerInterface
        factory: ['App\Module\Search\Infrastructure\Index\SearchIndexerFactory', 'create']
        arguments:
            $backend: '%env(default:app.search_backend.default:SEARCH_ENGINE_BACKEND)%'
            $fulltext: '@App\Module\Search\Infrastructure\Index\SearchIndexer'
            $openSearch: '@App\Module\Search\Infrastructure\Index\OpenSearchIndexer'
            # …and keeps the FULLTEXT table current behind it (HMAI-365), so the
            # standby the reader degrades to is not a frozen snapshot.
            $logger: '@logger'

    App\Module\Search\Domain\Port\SearchIndexerInterface:
        alias: app.search_indexer.backend

    # Dashboard read cache (HMAI-263): the composed cockpit read model is cached in
    # a dedicated Redis pool with a short TTL, keyed per reference day. The query
    # handler stays Infrastructure-agnostic behind the Application cache port.
    App\Module\Dashboard\Infrastructure\Cache\RedisDashboardCache:
        arguments:
            $cache: '@cache.dashboard'

    App\Module\Dashboard\Application\Cache\DashboardCacheInterface:
        alias: App\Module\Dashboard\Infrastructure\Cache\RedisDashboardCache

    # Dashboard aggregation (HMAI-258): per-widget DBAL read adapters expose each
    # source module's "today" slice; the composite delegates to them and backs the
    # DashboardDataProviderInterface port (deptrac-clean, no cross-module imports —
    # the Goals/Search precedent). Adapters + composite are autowired from src/.
    App\Module\Dashboard\Domain\Port\DashboardDataProviderInterface:
        alias: App\Module\Dashboard\Infrastructure\Provider\CompositeDashboardDataProvider

when@dev:
    services:
        # `make fixtures` needs these tagged as ORM fixtures, which is what
        # autoconfigure does once the bundle is present. The flags are set per
        # entry rather than through _defaults: a `when@` block has its own
        # defaults, and widening them here would silently re-configure every
        # other service the block declares.
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
            autowire: true
            autoconfigure: true

when@test:
    services:
        # FixturesLoadTest loads them, so the test environment registers them too.
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
            autowire: true
            autoconfigure: true

        App\Tests\Support\SpyLogger:
            public: true

        App\EventListener\ApiRateLimitListener:
            autoconfigure: true
            arguments:
                $apiPerIpLimiter: '@limiter.api_per_ip'
                $logger: '@App\Tests\Support\SpyLogger'

        Gelf\Transport\IgnoreErrorTransportWrapper:
            alias: gelf.transport
            public: true
        Gelf\Publisher:
            alias: gelf.publisher
            public: true
