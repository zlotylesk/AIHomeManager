monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - series
        - music
        - auth # HMAI-107: OAuth audit log (authorize, callback success/failure)

when@dev:
    monolog:
        handlers:
            # `rotating_file`, not `stream`: a plain stream handler never
            # trims its own file, and this one grew to 640 MB with nothing to
            # notice. Monolog rotates it onto a dated filename at the first
            # write after midnight and prunes anything past `max_files`, so
            # the directory stays bounded without a host-level cron or
            # logrotate entry — the same reasoning as `docker-compose.yml`'s
            # `logging:` limits, applied to the one log that bypasses Docker's
            # driver entirely because it is written to a bind-mounted file,
            # not stdout/stderr.
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                max_files: 7
                level: debug
                channels: ["!event"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            gelf:
                type: gelf
                publisher:
                    id: gelf.publisher
                level: debug
                channels: [series]
            new_relic:
                type: service
                id: App\Module\Series\Infrastructure\Logging\NewRelicMonologHandler
                level: debug
                channels: [series]
            auth_gelf:
                type: gelf
                publisher:
                    id: gelf.publisher
                level: info
                channels: [auth]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
            series_null:
                type: null
                channels: [series]
            auth_null:
                type: null
                channels: [auth]

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!deprecation"]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            # `null`, not a stream to stderr: unlike `main`, this channel was
            # never wrapped in `fingers_crossed`, so every deprecation notice
            # wrote to production logs on its own — measured at ~30 lines per
            # request that touched the OpenSearch client alone (a vendor
            # deprecation, not application code). A test-suite gate
            # (`failOnDeprecation` in phpunit.dist.xml) is what actually
            # forces these to be fixed; a production instance re-logging an
            # already-known, already-accepted one on every request is pure
            # volume with nothing actionable behind it. `when@dev` and
            # `when@test` are untouched — deprecations stay loud exactly
            # where a developer is looking for them.
            deprecation:
                type: null
                channels: [deprecation]
            gelf:
                type: gelf
                publisher:
                    id: gelf.publisher
                level: warning
                channels: [series]
            new_relic:
                type: service
                id: App\Module\Series\Infrastructure\Logging\NewRelicMonologHandler
                level: warning
                channels: [series]
            auth_gelf:
                type: gelf
                publisher:
                    id: gelf.publisher
                level: info
                channels: [auth]
            auth_stream:
                type: stream
                path: php://stderr
                level: info
                formatter: monolog.formatter.json
                channels: [auth]
