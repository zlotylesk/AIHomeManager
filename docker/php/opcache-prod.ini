; Production OPcache tuning. Copied only into the `prod` image stage, named so
; it sorts after custom.ini and therefore wins.
;
; The extension is NOT off in development: php:8.5-fpm-alpine ships OPcache
; compiled in with opcache.enable=On, so FPM has always been caching bytecode.
; What development runs is OPcache with development settings, and this file is
; the difference.

; validate_timestamps=1 makes PHP stat() every included file on every request so
; an edit is picked up without a restart. That is exactly right when the source
; is a bind mount, and pure cost in an image whose code cannot change without a
; rebuild — one syscall per included file per request, a few thousand of them.
;
; Turning it off means the only cache invalidation is process death, which is
; also the whole deployment model here: a release replaces the container, and
; the new one starts with an empty cache. Nothing calls opcache_reset().
opcache.enable = 1
opcache.validate_timestamps = 0

; src+vendor+config hold ~50k PHP files and a request pulls in a few thousand.
; The default 10000 slots is below the working set, so the cache would evict and
; recompile in a loop instead of settling — the pathological case that looks
; like "OPcache is on and it did not help".
opcache.max_accelerated_files = 20000
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
