## Read after the image's own conf.d/10-defaults.conf — RabbitMQ loads the
## directory in lexical order and a later file wins — which is the whole reason
## for the numeric prefix.
##
## The image sets `loopback_users.guest = false`, opening the built-in account
## to the whole network. That is a reasonable default for a broker whose ports
## are not published and a very bad one for anything else, and it is baked into
## the image rather than derived from RABBITMQ_DEFAULT_USER, so choosing a
## different default account does not switch it off.
##
## Setting it back to `true` confines `guest` to connections arriving on the
## loopback interface. It does not delete the account: on a volume created
## before the named account existed, `guest` is still there and still an
## administrator, and deleting it is a one-time step in docs/operations.md. What
## this line does is make that step non-urgent instead of load-bearing.
loopback_users.guest = true
