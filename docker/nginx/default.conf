# Development. Plain HTTP on the port docker-compose.yml publishes (8080 by
# default), because that is what the E2E suites, Newman and the container
# healthcheck talk to, and because a browser already treats localhost as a
# secure context — the Service Worker and every other secure-context API work
# here without a certificate.
#
# Production is a different file, docker/nginx/default.prod.conf, baked into the
# production nginx image. Everything the two share lives in snippets/ so that
# serving rules cannot drift between them.
include /etc/nginx/snippets/hsts-map.conf;

server {
    listen 80;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app.conf;
}
