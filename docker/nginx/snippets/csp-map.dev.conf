# Development-only counterpart to csp-map.conf, included by default.conf in
# place of the production file.
#
# The one difference is the jsdelivr exception in script-src, needed only by
# the FrankenPHP hot-reload script in base.html.twig, which itself only
# renders under APP_ENV=dev — kept out of csp-map.conf so production never
# carries a script-src exception it has no code path that needs. Kept
# identical to SecurityHeadersListener::contentSecurityPolicy()'s dev branch.
#
# Keyed on $request_uri, not $uri — see csp-map.conf for why $uri does not
# survive the internal try_files rewrite to /index.php.
map $request_uri $csp_policy {
    default "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";

    ~^/api/doc "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://cdn.redoc.ly; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";
}
