# Included at http level, once per site configuration, before any server
# block — same placement as hsts-map.conf.
#
# Two branches because Swagger UI and Redoc (served under /api/doc*) are
# vendor templates that render an inline <script>, and Redoc additionally an
# inline <style> and a Google Fonts stylesheet; the application's own pages
# carry neither and stay on the strict default. Kept identical to
# SecurityHeadersListener::CONTENT_SECURITY_POLICY /
# ::CONTENT_SECURITY_POLICY_API_DOC — ProductionRuntimeConfigTest compares
# this file against those constants the same way it compares the HSTS map.
#
# This is the production variant: no jsdelivr exception in script-src. The
# development site configuration includes csp-map.dev.conf instead, which
# adds the one CDN the FrankenPHP hot-reload script needs and which never
# renders outside APP_ENV=dev.
#
# Keyed on $request_uri, not $uri: every PHP-routed page reaches this map
# after app.conf's `try_files $uri /index.php$is_args$args`, which internally
# rewrites $uri to /index.php before the response is built — so a map keyed
# on $uri would see "/index.php" for every dynamic page and never match the
# /api/doc branch at all. $request_uri keeps the original, unrewritten path.
map $request_uri $csp_policy {
    default "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";

    ~^/api/doc "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://cdn.redoc.ly; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; worker-src 'self' blob:; base-uri 'self'; object-src 'none'; frame-ancestors 'none'";
}
