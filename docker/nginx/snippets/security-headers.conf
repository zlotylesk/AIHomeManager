# The security headers, in one file, included everywhere a response leaves nginx.
#
# A location-level `add_header` REPLACES the inherited server-level ones rather
# than adding to them. That is not a detail: it means the moment any location
# sets a header of its own — /sw.js sets two — it silently loses every header
# the server block declared. The rule is therefore "a location that sets any
# header re-declares all of them", and a shared file is what keeps the copies
# from drifting apart one edit at a time.
#
# $hsts_max_age comes from snippets/hsts-map.conf; it is empty over plain HTTP
# and nginx then omits the header entirely.
#
# These four are also set by SecurityHeadersListener on the PHP side. The
# duplication is deliberate: nginx covers what never reaches PHP (static files,
# /sw.js, its own error pages), PHP covers what nginx would pass through
# untouched if a location block were ever added without them.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
add_header Strict-Transport-Security $hsts_max_age always;
