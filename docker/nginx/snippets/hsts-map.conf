# Included at http level, once per site configuration, before any server block.
#
# This is the ONLY place the HSTS value is written. Both the development and the
# production site configuration include this file, so the header cannot say one
# thing on one stack and something else on the other, and
# ProductionRuntimeConfigTest compares what is here against
# SecurityHeadersListener's constant — the two layers announce one policy or the
# build fails.
#
# Keyed on $scheme rather than being a constant, because the header is only
# meaningful over TLS: RFC 6797 requires a user agent to IGNORE
# Strict-Transport-Security received over a plain-HTTP connection, so sending it
# there does nothing except invite the habit of trusting it somewhere it can be
# stripped. nginx omits an add_header whose value evaluates to the empty string,
# which is what turns this map into "present on HTTPS, absent on HTTP" with one
# directive rather than two divergent copies of the header list.
#
# No `preload`. Preloading is a submission to a list baked into browser binaries
# and is removed on browser release cadence, not on ours; a single-instance
# personal deployment gets the whole protection of max-age without taking on an
# undo that takes months.
map $scheme $hsts_max_age {
    https   "max-age=31536000; includeSubDomains";
    default "";
}
