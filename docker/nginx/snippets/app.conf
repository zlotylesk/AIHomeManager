# How the application is served. Included by the development site configuration
# (plain HTTP on :80) and by the production one (inside the TLS server block),
# so the two stacks serve the app through exactly the same rules and a change to
# the FastCGI parameters cannot land on one and miss the other.
#
# The enclosing server block owns everything that differs: the listener, the TLS
# material, `root` and `index`.

# Service Worker: the worker is served from the site root so its scope is the
# whole origin (a hashed /build/ path would narrow it). `no-cache` forces the
# browser to revalidate /sw.js on every navigation, so a freshly deployed
# app-shell is adopted at once instead of being shadowed by an HTTP-cached old
# worker — the core update-propagation guarantee.
#
# This block sets headers of its own, which is exactly the case where nginx
# drops the inherited ones, hence the include: without it /sw.js would be the
# one response in the application with no security headers at all.
# `Service-Worker-Allowed: /` is redundant for a root-served worker but pins the
# intended scope explicitly.
location = /sw.js {
    add_header Cache-Control "no-cache" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
}

location / {
    try_files $uri /index.php$is_args$args;
}

location ~ ^/index\.php(/|$) {
    fastcgi_pass php:9000;
    fastcgi_split_path_info ^(.+\.php)(/.*)$;
    fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    fastcgi_param DOCUMENT_ROOT $realpath_root;
    fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
    # What tells Symfony the browser is on HTTPS even though nginx talks to
    # PHP-FPM over a plain socket. framework.yaml trusts x-forwarded-proto, so
    # this is what makes $request->isSecure() true behind TLS termination — and
    # therefore what makes the application's own HSTS header and every generated
    # absolute URL come out as https.
    fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
    include fastcgi_params;
    internal;
}

location ~ \.php$ {
    return 404;
}
