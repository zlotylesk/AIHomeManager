# Production. Baked into aihm-nginx:prod — nothing bind-mounts over it, so what
# nginx serves is versioned with the image that serves it.
#
# The certificate paths are fixed and carry no domain name. That is what keeps
# the public hostname out of every configuration file: certbot issues under the
# lineage name `aihm` (`--cert-name aihm`), docker-entrypoint.d links that
# lineage to the two paths below, and the domain appears exactly once in the
# whole repository — as an argument to `make prod-cert-init`.
include /etc/nginx/snippets/hsts-map.conf;
include /etc/nginx/snippets/csp-map.conf;

# Plain HTTP. Two jobs, and the order between them is the point.
server {
    listen 80;
    server_tokens off;

    # The ACME http-01 challenge is answered here, over HTTP, and is NOT
    # redirected. `^~` beats the `/` prefix match, so this block wins before the
    # redirect below is ever considered.
    #
    # It has to work while there is no certificate at all: that is the state of
    # a brand-new instance, and it is also the state after a renewal has been
    # failing long enough for the old certificate to expire — precisely when the
    # path back to a working certificate must not run through HTTPS.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Everything else moves to HTTPS permanently, keeping path and query so a
    # bookmark or an OAuth callback lands on the same resource rather than the
    # home page.
    #
    # $host rather than a baked-in name: the redirect stays on whatever hostname
    # the request already used, which is what lets one image serve an instance
    # without being rebuilt when the domain changes.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_tokens off;
    root /var/www/html/public;
    index index.php;

    # Written by docker-entrypoint.d/20-tls-certificate.sh on every start:
    # symlinks into the Let's Encrypt lineage when one exists, a self-signed
    # placeholder when it does not. nginx therefore always starts, which is the
    # only way the challenge above can ever be served on a fresh host.
    #
    # Symlinks, not copies: certbot renews by repointing
    # /etc/letsencrypt/live/aihm/*.pem at a new file in archive/, so a reload
    # picks the new certificate up through this chain with nothing to copy and
    # nothing to keep in step.
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # Mozilla "intermediate": every browser from the last decade, no protocol
    # older than TLS 1.2. Cipher preference is left to the client because both
    # remaining protocol versions negotiate AEAD suites anyway, and clients pick
    # the one their hardware actually accelerates.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets without key rotation are a forward-secrecy hole that lasts
    # as long as the process does, and nginx has no rotation of its own.
    ssl_session_tickets off;

    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/app.conf;
}
