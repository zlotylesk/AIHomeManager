services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./app:/var/www/html
      - ./backups:/backups
      # Read-only, and here only so the disk probe can measure the filesystem
      # the database data actually lives on. `disk_free_space` reports on the
      # device holding a path, and the only path in this container that resolves
      # to the database's device is a mount of its volume — without one the
      # probe can only see the PHP image layer, which is what it used to
      # measure and what makes a green reading meaningless the moment the data
      # gets a volume or partition of its own.
      #
      # It grants no access the application does not already have: it holds the
      # credentials to every row in there. `:ro` is what keeps the files this
      # container can read from being files it could corrupt, and
      # ProductionRuntimeConfigTest fails the build if any service ever mounts
      # this volume writable.
      #
      # Compose's `volume.subpath` would narrow the exposure to one directory
      # inside the volume — same device, so the measurement would be identical.
      # Not used: every candidate subdirectory is MySQL's own (`sys`,
      # `#innodb_redo`), so the mount would break on a server version that
      # rearranged them, and it would trade a real dependency for a cosmetic
      # gain over a container that already holds the database password.
      - mysql_data:/var/lib/mysql:ro
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4
      # Both Redis DSNs, and both carry the password. LOCK_DSN is the one that is
      # easy to forget — it is not derived from REDIS_URL, it is a separate
      # variable read by config/packages/lock.yaml, so a password added to only
      # one of them leaves every lock acquisition failing while the caches work.
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      LOCK_DSN: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2f/messages
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # FastCGI, not HTTP: there is no web server in this container, only
    # php-fpm's own socket. `cgi-fcgi` speaks the protocol nginx speaks to
    # reach the `ping` responder enabled above — a check that answers only if
    # php-fpm itself is serving, not merely that the process is running.
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # The busiest source in the stack: the application's own log line per
    # request plus, in production, an unbuffered line per PHP deprecation
    # notice — see config/packages/monolog.yaml. Without a cap the default
    # `json-file` driver keeps every line forever; nothing here rotates on
    # its own.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  nginx:
    image: nginx:alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./app:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # The header and location rules development shares with production. The
      # site configuration above `include`s them, so nginx will not start
      # without this mount — which is the intended failure: the alternative is a
      # development stack quietly serving the app under different rules from the
      # one that ships.
      - ./docker/nginx/snippets:/etc/nginx/snippets:ro
    restart: unless-stopped
    # Waits for php to answer its own healthcheck, not merely to have started —
    # nginx proxies every request to php-fpm, so a restart that brings nginx up
    # first would serve 502s for however long php-fpm takes to warm up.
    depends_on:
      php:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    # The password is read from the environment inside the container rather than
    # interpolated into this line, so it does not end up in `docker ps`, in
    # `docker inspect`'s Cmd, or in the process table of the host.
    #
    # `exec` so redis-server becomes PID 1 and receives the TERM from
    # `docker stop` itself, instead of a shell swallowing it and every restart
    # waiting out the ten-second kill timer.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    # Authenticated, and it has to be: an unauthenticated PING against a
    # password-protected server answers NOAUTH, which redis-cli prints and then
    # exits 0 for. The container would report healthy while every client was
    # being refused. Grepping for the reply is what makes the probe read the
    # answer rather than the exit code.
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  rabbitmq:
    # Bumped 3.12 (EOL) → 4.x: current major (Khepri metadata backend, quorum
    # queues default). Major-pinned `:4` tracks the supported 4.x line. We use a
    # plain topic exchange + classic queues (no mirrored queues, removed in 4.0)
    # so the upgrade is low-risk.
    #
    # The broker keeps a named volume (HMAI-411). It used to have none, on the
    # grounds that its metadata is ephemeral — but the same directory holds the
    # QUEUE CONTENTS, so that decision also threw away every message in flight.
    # The exchanges, queues and messages are all durable already (Symfony's AMQP
    # transport declares AMQP_DURABLE and sets delivery_mode 2), which is why a
    # plain `docker compose restart` never lost anything and the gap stayed
    # invisible: durability is written to /var/lib/rabbitmq, and without a volume
    # that lives in the container's writable layer. Recreating the container —
    # `docker compose down`, an image bump, any edit to this file — took the DLQ
    # with it. Measured before the fix: a message parked in `failed` survived a
    # restart, and after `--force-recreate` the queue itself no longer existed.
    #
    # What that costs is the whole point of having a DLQ: a failed Trakt import,
    # a notification that never sent, an unindexed document. The queue exists so
    # a failure waits for a human, and a failure that silently disappears leaves
    # the system looking healthy — the 1.31.0 pattern.
    image: rabbitmq:4-management-alpine
    # A FIXED hostname, and it is load-bearing rather than cosmetic: RabbitMQ
    # derives its node name from it (`rabbit@<hostname>`) and stores that node's
    # database under /var/lib/rabbitmq/mnesia/<node>. Docker otherwise hands the
    # container its ID as the hostname, so every recreation starts a brand-new
    # node that comes up EMPTY while the previous node's data sits untouched
    # beside it in the same volume — the mount looks like it is working, and the
    # DLQ still evaporates. Measured while writing this: two node directories,
    # rabbit@bc2b4397acdb and rabbit@e47e36d8e8d0, one message stranded in the
    # older one. The volume without this line would have been a fix in name only.
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      # NOT `guest`, and the name is the mechanism rather than a preference. The
      # image ships /etc/rabbitmq/conf.d/10-defaults.conf with
      # `loopback_users.guest = false` compiled in, so the built-in account is
      # reachable from anywhere the port is; and the built-in account only exists
      # because RabbitMQ creates `default_user` when it initialises an EMPTY
      # database. Naming a different default means a fresh volume never has a
      # guest account at all.
      #
      # An existing volume is a different matter: the default user is created on
      # first boot only, so `guest` survives this change and has to be deleted by
      # hand. docs/operations.md carries that procedure; the conf.d file mounted
      # below is what covers the gap in the meantime.
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      # Read after the image's own 10-defaults.conf and therefore winning over
      # it. Mounted in development too: the point of a shared file is that the
      # broker cannot be configured one way where it is tested and another way
      # where it runs.
      - ./docker/rabbitmq/20-aihm.conf:/etc/rabbitmq/conf.d/20-aihm.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  messenger_worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./app:/var/www/html
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      LOCK_DSN: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2f/messages
    command: php bin/console messenger:consume async --time-limit=3600 -vv
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # `-vv` above makes this as busy a source as `php` itself — one line per
    # consumed message, not just per failure.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  node:
    image: node:24-alpine
    working_dir: /var/www/html
    volumes:
      - ./app:/var/www/html
    command: ["sh", "-c", "tail -f /dev/null"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  scheduler_worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    volumes:
      - ./app:/var/www/html
      - ./backups:/backups
      # The same read-only mount as the php service, for the same probe: the
      # monitoring sweep asks HealthChecker in-process from THIS container, so
      # without it the alerting half would report a measurement it cannot take
      # while the endpoint half measured fine.
      - mysql_data:/var/lib/mysql:ro
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}?serverVersion=8.0&charset=utf8mb4
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      LOCK_DSN: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379
      MESSENGER_TRANSPORT_DSN: amqp://${RABBITMQ_USER:?set RABBITMQ_USER in .env}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}@rabbitmq:5672/%2f/messages
    command: php bin/console messenger:consume scheduler_default --time-limit=3600 -vv
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  search:
    # App-data search engine (HMAI-360, epic HMAI-359). A SEPARATE instance from
    # the monitoring OpenSearch below (Graylog's log store): different lifecycle,
    # different retention, and this one must come up with the lean stack too — so
    # it carries no `monitoring` profile and starts on both `make up` and
    # `make min-up`. OpenSearch 2.x (Apache-2.0, API-compatible with the app's
    # opensearch-php client); the security plugin is off for a single-user
    # dev/CI box. Single-node = dev mode, so the vm.max_map_count bootstrap check
    # is a warning, not a fatal (matches the monitoring OpenSearch).
    #
    # Built from docker/opensearch (HMAI-362) rather than pulled: the stock image
    # carries no Polish analysis, and the index mappings depend on it.
    build:
      context: docker/opensearch
    image: aihm-search:local
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
      - bootstrap.memory_lock=false
    ports:
      - "${SEARCH_HTTP_PORT:-9200}:9200"
    volumes:
      - search_data:/usr/share/opensearch/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # The `monitoring` profile's own three services carry their own memory and
  # logging limits here — their only definition, dev and prod alike —
  # precisely so that turning the profile on never competes with
  # mysql/redis/rabbitmq/search for a shared budget: each of the two stacks
  # is sized independently.
  mongodb:
    image: mongo:7
    profiles: [monitoring]
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    # Log metadata and Graylog's own configuration only — the log bodies live
    # in the opensearch service below. WiredTiger auto-sizes its cache off the
    # cgroup limit it detects, so this is a ceiling rather than a tuned value.
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  opensearch:
    # Stays on OpenSearch 2.x: Graylog 6.3 supports OpenSearch 1.1.x–2.19.5 only,
    # 3.0+ is NOT supported. Major-pinned `:2` tracks the latest supported 2.x line.
    image: opensearchproject/opensearch:2
    profiles: [monitoring]
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    restart: unless-stopped
    # Roughly double the fixed 512m JVM heap above: the rest of a JVM's
    # footprint — thread stacks, direct buffers, Lucene's own off-heap
    # structures — lives outside `-Xmx` and a limit pinned to the heap size
    # alone gets the container OOM-killed the moment those add up.
    mem_limit: 1024m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  graylog:
    image: graylog/graylog:6.3
    profiles: [monitoring]
    restart: unless-stopped
    # No -Xmx configured for Graylog's own JVM, so it ergonomically sizes
    # itself off the cgroup limit below rather than the host's full memory —
    # adequate for a single-user instance's log volume.
    mem_limit: 1024m
    environment:
      # From the environment, with no default here, exactly like the Redis and
      # broker credentials above.
      #
      # A `:-default` would be worse than the literals it replaced: the file
      # would read as configurable while a production stack that set nothing
      # still came up on the image's own administrator password, and the way to
      # find that out is the login page accepting `admin`/`admin`.
      #
      # Set in the tracked `.env` with development values. Compose interpolates
      # every service in the file regardless of profile, so these are required
      # even for a stack that never starts the monitoring one.
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?set GRAYLOG_PASSWORD_SECRET in .env}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?set GRAYLOG_ROOT_PASSWORD_SHA2 in .env}
      GRAYLOG_HTTP_EXTERNAL_URI: http://localhost:9000/
      GRAYLOG_MONGODB_URI: mongodb://mongodb:27017/graylog
      GRAYLOG_ELASTICSEARCH_HOSTS: http://opensearch:9200
    ports:
      - "9000:9000"
      - "12201:12201/udp"
    depends_on:
      - mongodb
      - opensearch
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  mysql_data:
  mongodb_data:
  opensearch_data:
  search_data:
  rabbitmq_data: