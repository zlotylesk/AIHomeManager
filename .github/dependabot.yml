# HMAI-152: daily dependency surveillance. Composer + npm (frontend + root)
# + GitHub Actions ecosystems each get scheduled PRs from `dependabot[bot]`.
# Groups collapse symfony/* and doctrine/* into single PRs so an 8-package
# Symfony bump does not produce 8 separate reviews.
#
# target-branch: develop — Dependabot opens PRs against `develop` (the working
# branch), not the default branch `master`, so bumps flow through the normal
# develop -> master release path instead of landing on master and needing a
# back-merge. Dependabot still reads THIS config from the default branch (master).
#
# Manual fallback: `make audit` (composer) and `make node-audit` (frontend
# npm) still run in CI for high+critical CVEs — Dependabot covers freshness,
# audit covers severity-gated regressions.
version: 2
updates:
  - package-ecosystem: composer
    directory: /app
    target-branch: develop
    schedule:
      interval: daily
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # doctrine/orm 3.6.8 adds GenerateSchemaEventArgs::setSchema(), which
      # throws unless DBAL exposes Schema::edit() — an API its own source
      # comment calls unreleased, requiring doctrine/dbal ^4.5 when the newest
      # stable is 4.4.4. symfony/doctrine-bridge feature-detects the method with
      # method_exists(), so the bump turns that detection into a false positive
      # and every `doctrine:schema:validate` into a BadMethodCallException —
      # which is CI's first red step, before a single test runs.
      #
      # The same shape as the webpack-cli peer range Encore pins on the npm
      # side: a bump that is correct in isolation and broken in combination,
      # where the only safe move is to wait for the other half to catch up.
      # Drop this once DBAL 4.5 is released, then unpin doctrine/orm in
      # app/composer.json.
      - dependency-name: "doctrine/orm"
        versions: [">=3.6.8"]
      # phpunit 13.3 deprecates the --do-not-cache-result CLI option, which
      # paratest still passes to every worker it spawns. phpunit.dist.xml sets
      # failOnPhpunitDeprecation, so the parallel run CI uses exits 1 on a suite
      # where every test passed. Upgrading paratest does not help: 7.24 is the
      # first release requiring phpunit ^13.3, and it emits the same flag.
      #
      # The constraint in app/composer.json (>=13.1.13 <13.3) is what actually
      # holds the pair together — paratest 7.24 needs ^13.3.0, so capping phpunit
      # keeps both on the last combination that runs clean. Lift both once
      # paratest stops passing the deprecated flag.
      - dependency-name: "phpunit/phpunit"
        versions: [">=13.3.0"]
    groups:
      symfony:
        patterns:
          - "symfony/*"
      doctrine:
        patterns:
          - "doctrine/*"
      dev:
        dependency-type: development

  - package-ecosystem: npm
    directory: /app
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: daily
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
