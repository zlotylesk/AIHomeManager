# Production overlay. Never used alone — it is merged on top of
# docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The `make prod-*` targets pass both files for you.
#
# What this file changes is WHERE THE CODE COMES FROM. Development mounts
# ./app over /var/www/html, so the image contents are irrelevant and an edit is
# live. Production runs the code baked into the image, which is what makes a
# deployment a single reproducible artifact instead of the state of a working
# copy.
#
# restart policies live in the base docker-compose.yml (restart: unless-stopped
# is a scalar and merges into this overlay unmodified, the same as it already
# does for messenger_worker/scheduler_worker/node) — nothing to repeat here
# except for certbot, which this file defines and the base one does not.
#
# Memory limits are prod-only, and deliberately not in the base file: `php`
# and `scheduler_worker` are also where `docker exec` runs the heavier dev
# tooling — `make phpstan` alone asks for `--memory-limit=1G` — and a cgroup
# ceiling sized for the running application would starve that. Log rotation
# remains out of scope; it is its own change.

services:
  php:
    build:
      target: prod
    image: aihm-php:prod
    # !override REPLACES the base list rather than appending to it. Without it
    # Compose would merge, ./app:/var/www/html would survive, and the host
    # working copy would shadow every file in the image — the one mistake that
    # makes a production container silently run development code.
    volumes: !override
      - ./backups:/backups
      # Repeated from the base file rather than inherited: !override replaces
      # the list, so a mount left out here is one production simply does not
      # have — and the disk probe would answer "cannot measure" on the one
      # environment the measurement exists for.
      - mysql_data:/var/lib/mysql:ro
    # The secrets, as environment variables rather than a file in the image.
    # app/.env.local is deliberately excluded from the build context, so without
    # this the container falls back to the placeholder values in the tracked
    # app/.env and boots with an EMPTY API_KEY and an empty
    # FRONTEND_PASSWORD_HASH — authentication that silently protects nothing.
    #
    # Required, not optional: a missing secrets file must stop a deployment
    # rather than produce a running instance with no credentials.
    env_file:
      - app/.env.local
    # Declared after env_file, which is what makes these win over anything the
    # file happens to set.
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    # Sized above php.ini's own 512M `memory_limit`: one request near that
    # ceiling plus opcache's shared segment plus a few lightweight concurrent
    # requests (the dashboard alone fans out one fetch per widget) has to fit
    # without the cgroup killing the process before PHP's own limit ever
    # would. See docs/operations.md for the full budget.
    mem_limit: 1024m

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    image: aihm-nginx:prod
    # The public ports. !override because Compose APPENDS sequences: merged, the
    # base file's 8080:80 would survive alongside these and the instance would
    # answer on a third port nobody configured a certificate or a callback for.
    ports: !override
      - "80:80"
      - "443:443"
    # Drops the ./app and default.conf bind mounts — the config is copied into
    # the image, so what nginx serves is versioned with it — and adds the two
    # volumes it shares with certbot: the certificates it serves, and the
    # directory the challenge is written into. Both are shared, and a mismatch
    # in either is a renewal that fails sixty days later, which is why
    # ProductionRuntimeConfigTest compares the two services' mounts.
    volumes: !override
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Reload on a timer, because a renewed certificate is a new file that a
    # running nginx never re-reads. certbot cannot signal a process in another
    # container, so the reload lives with the process that needs it. A graceful
    # reload costs nothing and twelve hours is well inside the thirty days
    # between a successful renewal and the old certificate expiring.
    #
    # `exec` on the server itself: nginx becomes PID 1 and receives the TERM
    # from `docker stop` directly, instead of a shell swallowing it and every
    # deployment waiting out the ten-second kill timer.
    #
    # And it execs /docker-entrypoint.sh rather than nginx, which is not
    # ceremony. The image's entrypoint runs the scripts in
    # /docker-entrypoint.d/ ONLY when its first argument is `nginx`; overriding
    # the command makes that argument `/bin/sh`, so the whole directory is
    # skipped in silence — including the script that puts a certificate where
    # ssl_certificate points. nginx would then fail to start, on a stack whose
    # every other piece is correct. Naming the entrypoint explicitly restores
    # the argument it tests for.
    command: ["/bin/sh", "-c", "while :; do sleep 12h & wait $${!}; nginx -s reload; done & exec /docker-entrypoint.sh nginx -g 'daemon off;'"]
    healthcheck:
      # Against HTTPS, and !override because the base file's plain-HTTP probe
      # would now be answered by the redirect. wget FOLLOWS a 301, so it would
      # arrive at https://127.0.0.1 and reject a certificate issued for the
      # public name — an instance serving perfectly while Compose reports it
      # unhealthy. The certificate is not what this probe is asking about;
      # whether nginx is answering is.
      test: !override ["CMD", "wget", "--no-check-certificate", "--quiet", "--spider", "https://127.0.0.1/api/health"]
    # A static file server plus a TLS terminator; idle nginx workers run in
    # single-digit megabytes each.
    mem_limit: 64m

  messenger_worker:
    build:
      target: prod
    image: aihm-php:prod
    volumes: !override []
    # The secrets, as environment variables rather than a file in the image.
    # app/.env.local is deliberately excluded from the build context, so without
    # this the container falls back to the placeholder values in the tracked
    # app/.env and boots with an EMPTY API_KEY and an empty
    # FRONTEND_PASSWORD_HASH — authentication that silently protects nothing.
    #
    # Required, not optional: a missing secrets file must stop a deployment
    # rather than produce a running instance with no credentials.
    env_file:
      - app/.env.local
    # Declared after env_file, which is what makes these win over anything the
    # file happens to set.
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    # A single long-running CLI process rather than php-fpm's several children,
    # so it needs no multiplier — just php.ini's own 512M `memory_limit` plus
    # opcache and interpreter overhead, with headroom for the heaviest handler
    # (a full Trakt catalog import).
    mem_limit: 768m

  scheduler_worker:
    build:
      target: prod
    image: aihm-php:prod
    volumes: !override
      - ./backups:/backups
      # As on php above, and for the probe this container runs itself.
      - mysql_data:/var/lib/mysql:ro
      # The monitoring sweep's "already announced" set. Without a mount it lives
      # in the container's writable layer, so every recreation — an image bump,
      # any edit to this file — would re-announce whatever was already failing.
      # The state is deliberately not in MySQL or Redis (it has to survive those
      # being the thing that broke), which is exactly why it needs a volume of
      # its own rather than inheriting one.
      - monitoring_state:/var/www/html/var/monitoring
      # Off-host copies with BACKUP_REMOTE_BACKEND=directory. Deliberately left
      # commented and un-defaulted: the whole value of this mount is that the
      # left-hand side is storage that does not die with this machine — a NAS
      # export, an external disk — and only the operator knows where that is on
      # their host. A default pointing somewhere under the project directory
      # would be refused at push time anyway (LocalDirectoryBackupDestination
      # compares filesystems), which is the right outcome but a confusing way to
      # learn about the setting.
      #
      #   - /mnt/nas/aihm-backups:/backups-offsite
      #
      # then BACKUP_REMOTE_BACKEND=directory and BACKUP_REMOTE_DIR=/backups-offsite
      # in app/.env.local. With BACKUP_REMOTE_BACKEND=rclone no mount is needed —
      # add ~/.config/rclone/rclone.conf instead. See docs/operations.md.
    # The secrets, as environment variables rather than a file in the image.
    # app/.env.local is deliberately excluded from the build context, so without
    # this the container falls back to the placeholder values in the tracked
    # app/.env and boots with an EMPTY API_KEY and an empty
    # FRONTEND_PASSWORD_HASH — authentication that silently protects nothing.
    #
    # Required, not optional: a missing secrets file must stop a deployment
    # rather than produce a running instance with no credentials.
    env_file:
      - app/.env.local
    # Declared after env_file, which is what makes these win over anything the
    # file happens to set.
    environment:
      APP_ENV: prod
      APP_DEBUG: 0
    # As messenger_worker above, plus the monitoring sweep it runs in-process
    # on every scheduler tick — no larger a footprint than a request handler,
    # since the backup dump itself runs as an external `mysqldump`/`gzip`
    # process rather than inside the PHP heap.
    mem_limit: 768m

  # The four infrastructure services, none of which publishes a port here.
  #
  # `!override []` rather than a narrowed mapping, and rather than nothing at
  # all: Compose APPENDS untagged sequences, so an overlay that simply omitted
  # `ports:` would inherit the base file's publishing wholesale and an overlay
  # that listed loopback bindings would end up with BOTH — the 0.0.0.0 mapping
  # from the base file alongside the 127.0.0.1 one, which is the wide-open case
  # wearing the clothes of the fix.
  #
  # Nothing outside the Compose network needs to reach any of them. The
  # application containers resolve `mysql`, `redis`, `rabbitmq` and `search` by
  # service name over the internal network, which is unaffected by whether a
  # port is published; publishing only ever decided whether the HOST — and, on
  # a machine with a public address, everything that can route to it — could
  # reach them too. Three of the four answer with no credential worth the name
  # (the broker's management UI on 15672, an unauthenticated OpenSearch on
  # 9200, and until this change a Redis with no password at all), so what was
  # published was not a service with a login screen in front of it.
  #
  # Diagnostics do not need them either. `docker compose exec` runs a client
  # inside the container, which is both closer to the thing being diagnosed and
  # available on a host where the port never was — docs/operations.md carries
  # the commands for each service, and `make prod-*` targets several of them.
  # Each limit is justified in docs/operations.md alongside the total budget;
  # the short version lives in the comment on each service below.
  mysql:
    ports: !override []
    # Headroom over the 128M default InnoDB buffer pool for server threads,
    # per-connection buffers and the library's own small, mostly-relational
    # dataset — no tuned my.cnf exists, so this is sized around the defaults.
    mem_limit: 768m

  redis:
    ports: !override []
    # No `maxmemory` is configured — see docs/operations.md for why an
    # eviction policy is deliberately not part of this change — so the limit
    # exists purely as a ceiling against a runaway, not a tuned working set.
    # What actually lives here (cache pools, lock keys, worker heartbeats) is
    # tens of megabytes for a single-user instance.
    mem_limit: 256m

  rabbitmq:
    ports: !override []
    # The Erlang VM alone runs close to 150–200M near-idle. RabbitMQ
    # auto-detects this cgroup limit and sets its own publish-throttling
    # watermark at 40% of it (~200M here), so the broker degrades by pausing
    # publishers under memory pressure well before the container would be
    # OOM-killed.
    mem_limit: 512m

  search:
    ports: !override []
    # Same reasoning as the monitoring OpenSearch in docker-compose.yml:
    # roughly double the service's own -Xmx512m JVM heap for what lives
    # outside it.
    mem_limit: 1024m

  # Graylog is behind the `monitoring` profile and so does not start with
  # `make prod-up` at all. It is pinned to loopback rather than left alone
  # because the day someone does start it is not the day to discover that its
  # web UI went straight to the public address with the image's default
  # administrator password still in the compose file.
  #
  # Loopback rather than nothing, unlike the four above: this one is a web UI
  # whose whole purpose is to be looked at, and `ssh -L 9000:127.0.0.1:9000` is
  # a working answer for that. The GELF input stays internal — log shipping
  # comes from the other containers over the Compose network.
  graylog:
    ports: !override
      - "127.0.0.1:9000:9000"

  # Certificate renewal, running as its own process rather than as a host cron
  # job, so it is deployed and started by the same command as everything else
  # and cannot be the one piece of the stack that was never set up.
  #
  # `certbot renew` is a no-op until a certificate is inside thirty days of
  # expiry, which is what makes running it twice a day the normal
  # configuration rather than an aggressive one: renewal gets roughly sixty
  # attempts before anything expires, so a spell of downtime, a rate limit or a
  # DNS change costs an attempt instead of the certificate.
  #
  # It needs no domain: the lineage and its authenticator were recorded in
  # /etc/letsencrypt/renewal/aihm.conf at issuance, so this survives a domain
  # change with no edit here.
  certbot:
    # Deliberately unpinned, and the only image here that is. Renewal talks to
    # an external CA over a protocol that has changed under its users before —
    # ACMEv1 shutdown, the 2021 root expiry. A certbot pinned to the version
    # that was current at deployment fails on the day the CA moves, and it fails
    # sixty days after anyone touched this file.
    image: certbot/certbot:latest
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done"]
    depends_on:
      - nginx
    # No base-file entry to inherit from — certbot exists only in this
    # overlay — so both the restart policy and the limit are declared here
    # directly rather than merged in.
    restart: unless-stopped
    # A Python CLI that wakes up twice a day; comfortably lightweight.
    mem_limit: 128m

  # The frontend bundle is built inside the image by the `assets` stage, so the
  # long-running Node container has nothing to do in production. Parking it
  # behind a profile keeps it out of `prod-up` while leaving `make up` — which
  # requests no profile beyond `monitoring` — exactly as it was.
  node:
    profiles: [tools]

# Merged with the base file's volumes rather than replacing them: top-level
# mappings are combined key by key, which is why this needs no !override (unlike
# the service-level `volumes:` sequences above, where an untagged list would be
# appended to the dev bind mount instead of replacing it).
volumes:
  monitoring_state:
  # The certificates and, with them, certbot's account key and the renewal
  # configuration that records the lineage. Losing this volume does not only
  # cost the certificate — it costs the ability to renew, and a re-issue counts
  # against the CA's rate limit for the domain.
  letsencrypt:
  # Where certbot writes the challenge token and nginx reads it from. It holds
  # nothing worth keeping; it exists so that the two containers are looking at
  # one directory.
  certbot_webroot:
